<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider Fruit Soda</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <a
        href="https://theloopstudio.org"
        target="_blank"
        rel="noopener noreferrer"
        class="logo-link"
      >
        <img src="img/loop_studio.png" alt="Loop Studio" class="logo" />
      </a>
      <nav>
        <ul>
          <li>HOME</li>
          <li>CONTACT</li>
          <li>LOGIN</li>
        </ul>
      </nav>
    </header>

    <div class="carousel">
      <div class="list">
        <div class="item active" style="--bg: #ea3d41">
          <div class="content">strawberry</div>
          <img src="img/fruit_strawberry.png" class="fruit" />
        </div>

        <div class="item" style="--bg: #2d5643">
          <div class="content">avocado</div>
          <img src="img/fruit_avocado.png" class="fruit" />
        </div>

        <div class="item hidden" style="--bg: #e7a043">
          <div class="content">orange</div>
          <img src="img/fruit_orange.png" class="fruit" />
        </div>
      </div>

      <div class="leaves"></div>
      <div class="mockup"></div>
      <div class="shadow"></div>
      <div class="arrow">
        <button id="prev"><</button>
        <button id="next">></button>
      </div>
    </div>
  </body>
</html>
