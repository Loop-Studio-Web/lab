<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<title data-i18n="cr.title">Contatto rapido — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../_shared/suite.css" />
		<script src="../_shared/suite.js" defer></script>
	</head>
	<body>
		<h1 class="sr-only" data-i18n="cr.h1">Contatto rapido</h1>
		<div data-suite>
			<div class="suite__top">
				<div class="suite__scroll">
					<div class="suite__list" role="tablist" aria-label="Modi di farsi contattare da una pagina" data-i18n-attr="aria-label=cr.tabs">
						<button type="button" role="tab" id="t-flottante" data-id="flottante" data-src="flottante/" data-title="Flottante" data-i18n="flottante.name" data-i18n-attr="data-title=flottante.name">Flottante</button>
						<button type="button" role="tab" id="t-barra-cta" data-id="barra-cta" data-src="barra-cta/" data-title="Barra CTA" data-i18n="barracta.name" data-i18n-attr="data-title=barracta.name">Barra CTA</button>
						<button type="button" role="tab" id="t-assistente" data-id="assistente" data-src="assistente/" data-title="Assistente" data-i18n="assistente.name" data-i18n-attr="data-title=assistente.name">Assistente</button>
						<span class="suite__bar" aria-hidden="true"></span>
					</div>
				</div>
			</div>
			<div class="suite__panels"></div>
		</div>
		<script src="../_shared/studio.js"></script>
	</body>
</html>
