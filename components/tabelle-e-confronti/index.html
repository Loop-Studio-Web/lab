<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<title data-i18n="tc.title">Tabelle e confronti — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../_shared/suite.css" />
		<script src="../_shared/suite.js" defer></script>
	</head>
	<body>
		<h1 class="sr-only" data-i18n="tc.h1">Tabelle e confronti</h1>
		<div data-suite>
			<div class="suite__top">
				<div class="suite__scroll">
					<div class="suite__list" role="tablist" aria-label="Tre modi di presentare i dati in tabella" data-i18n-attr="aria-label=tc.tabs">
						<button type="button" role="tab" id="t-listino" data-id="listino" data-src="listino/" data-title="Listino" data-i18n="ls.name" data-i18n-attr="data-title=ls.name">Listino</button>
						<button type="button" role="tab" id="t-confronto" data-id="confronto" data-src="confronto/" data-title="Confronto" data-i18n="cf.name" data-i18n-attr="data-title=cf.name">Confronto</button>
						<button type="button" role="tab" id="t-matrice" data-id="matrice" data-src="matrice/" data-title="Matrice" data-i18n="mx.name" data-i18n-attr="data-title=mx.name">Matrice</button>
						<span class="suite__bar" aria-hidden="true"></span>
					</div>
				</div>
			</div>
			<div class="suite__panels"></div>
		</div>
		<script src="../_shared/studio.js"></script>
	</body>
</html>
