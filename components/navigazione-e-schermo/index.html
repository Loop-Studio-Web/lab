<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<title data-i18n="np.title">Navigazione e schermo — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../_shared/suite.css" />
		<script src="../_shared/suite.js" defer></script>
	</head>
	<body>
		<h1 class="sr-only" data-i18n="np.h1">Navigazione e schermo</h1>
		<div data-suite>
			<div class="suite__top">
				<div class="suite__scroll">
					<div class="suite__list" role="tablist" aria-label="Zona del pollice e schermo reale" data-i18n-attr="aria-label=np.tabs">
						<button type="button" role="tab" id="t-pollice" data-id="pollice" data-src="pollice/" data-title="Zona del pollice" data-i18n="pz.name" data-i18n-attr="data-title=pz.name">Zona del pollice</button>
						<button type="button" role="tab" id="t-schermo" data-id="schermo" data-src="schermo/" data-title="Schermo reale" data-i18n="sc.name" data-i18n-attr="data-title=sc.name">Schermo reale</button>
						<span class="suite__bar" aria-hidden="true"></span>
					</div>
				</div>
			</div>
			<div class="suite__panels"></div>
		</div>
		<script src="../_shared/studio.js"></script>
	</body>
</html>
