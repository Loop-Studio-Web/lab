<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<title data-i18n="cr.1">Campi e ricerca — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../_shared/suite.css" />
		<script src="../_shared/suite.js" defer></script>

	<body>
		<h1 class="sr-only" data-i18n="cr.2">Campi e ricerca</h1>
		<div data-suite>
			<div class="suite__top">
				<div class="suite__scroll">
					<div class="suite__list" role="tablist" aria-label="Campi e ricerca" data-i18n-attr="aria-label=cr.6">
						<button type="button" role="tab" id="t-campi" data-id="campi" data-src="../campi-testo/" data-title="Campi di testo" data-i18n="cr.3" data-i18n-attr="data-title=cr.3">Campi di testo</button>

						<button type="button" role="tab" id="t-orario" data-id="orario" data-src="../orario-arco/" data-title="Orario ad arco" data-i18n="cr.5" data-i18n-attr="data-title=cr.5">Orario ad arco</button>

				</div>
			</div>
			<div class="suite__panels"></div>
		</div>
		<script src="../_shared/studio.js"></script>
