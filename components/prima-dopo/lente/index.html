<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lente — Loop Studio Lab</title>
		<link rel="preload" href="../../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../ba.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<main class="demo">
			<header class="demo__head">
				<h1>Lente</h1>
			</header>
			<div class="ba" data-ba tabindex="0" role="group" aria-label="Foto con lente: muovi il puntatore o usa le frecce">
				<img src="../img/prima.webp" width="900" height="600" alt="Manarola prima del ritocco" />
				<div class="ba__lens" data-lens aria-hidden="true">
					<img src="../img/dopo.webp" width="900" height="600" alt="" />
				</div>
				<span class="ba__ring" data-ring aria-hidden="true"></span>
				<span class="ba__tag ba__tag--prima" aria-hidden="true">Prima</span>
				<span class="ba__tag ba__tag--dopo" aria-hidden="true">Dopo, nella lente</span>
			</div>
			<p class="ba-caption ba-caption--lead">Muovi il puntatore: la lente mostra il dopo dentro il prima.</p>
			<p class="ba-caption" lang="en">Hover, drag or use the arrow keys — the lens reveals the retouched version.</p>
		</main>
		<script src="../../_shared/studio.js"></script>
	</body>
</html>
