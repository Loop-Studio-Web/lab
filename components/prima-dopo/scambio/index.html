<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scambio — Loop Studio Lab</title>
		<link rel="preload" href="../../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../ba.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<main class="demo">
			<header class="demo__head">
				<h1>Scambio</h1>
			</header>
			<div class="ba" data-ba >
				<img class="ba__a" src="../img/prima.webp" width="900" height="600" alt="Manarola prima del ritocco: spenta e sfocata" />
				<img class="ba__b" src="../img/dopo.webp" width="900" height="600" alt="Manarola dopo il ritocco: colori pieni e nitida" />
				<span class="ba__tag ba__tag--prima" data-tag aria-hidden="true">Prima</span>
			</div>
			<div class="ba-controls" role="group" aria-label="Versione della foto">
				<button type="button" class="ba-btn" data-v="prima" aria-pressed="true">Prima</button>
				<button type="button" class="ba-btn" data-v="dopo" aria-pressed="false">Dopo</button>
			</div>
			<p class="ba-caption ba-caption--lead">Due foto, un tasto: cambia con una dissolvenza.</p>
			<p class="ba-caption" lang="en">Tip: press and hold the photo to peek at the original.</p>
		</main>
		<script src="../../_shared/studio.js"></script>
	</body>
</html>
