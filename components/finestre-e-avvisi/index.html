<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<meta name="description" content="Notifiche toast, banner dei cookie e finestra con video: avvisi e modali pronti da copiare." data-i18n-attr="content=fa.d" />
		<title data-i18n="fa.1">Finestre e avvisi — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../_shared/suite.css" />
		<script src="../_shared/suite.js" defer></script>
	</head>
	<body>
		<h1 class="sr-only" data-i18n="fa.2">Finestre e avvisi</h1>
		<div data-suite>
			<div class="suite__top">
				<div class="suite__scroll">
					<div class="suite__list" role="tablist" aria-label="Finestre e avvisi" data-i18n-attr="aria-label=fa.6">
						<button type="button" role="tab" id="t-toast" data-id="toast" data-src="../toast-notification/" data-title="Toast" data-i18n="fa.3" data-i18n-attr="data-title=fa.3">Toast</button>
						<button type="button" role="tab" id="t-cookie" data-id="cookie" data-src="../cookie/" data-title="Avviso cookie" data-i18n="fa.4" data-i18n-attr="data-title=fa.4">Avviso cookie</button>
						<button type="button" role="tab" id="t-video" data-id="video" data-src="../video-trailer-popup/" data-title="Popup video" data-i18n="fa.5" data-i18n-attr="data-title=fa.5">Popup video</button>
						<span class="suite__bar" aria-hidden="true"></span>
					</div>
				</div>
			</div>
			<div class="suite__panels"></div>
		</div>
		<script src="../_shared/studio.js"></script>
	</body>
</html>
