<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<meta name="description" content="Barra di navigazione fissa, menu hamburger e menu con effetto al passaggio: navigazione pronta da copiare." data-i18n-attr="content=nv.d" />
		<title data-i18n="nv.1">Navigazione — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../_shared/suite.css" />
		<script src="../_shared/suite.js" defer></script>
	</head>
	<body>
		<h1 class="sr-only" data-i18n="nv.2">Navigazione</h1>
		<div data-suite>
			<div class="suite__top">
				<div class="suite__scroll">
					<div class="suite__list" role="tablist" aria-label="Elementi di navigazione" data-i18n-attr="aria-label=nv.6">
						<button type="button" role="tab" id="t-navbar" data-id="navbar" data-src="../sticky-navbar/" data-title="Navbar fissa" data-i18n="nv.3" data-i18n-attr="data-title=nv.3">Navbar fissa</button>
						<button type="button" role="tab" id="t-hamburger" data-id="hamburger" data-src="../hamburger/" data-title="Hamburger" data-i18n="nv.4" data-i18n-attr="data-title=nv.4">Hamburger</button>
						<button type="button" role="tab" id="t-menu" data-id="menu" data-src="../menu-hover/" data-title="Menu con riflesso" data-i18n="nv.5" data-i18n-attr="data-title=nv.5">Menu con riflesso</button>
						<span class="suite__bar" aria-hidden="true"></span>
					</div>
				</div>
			</div>
			<div class="suite__panels"></div>
		</div>
		<script src="../_shared/studio.js"></script>
	</body>
</html>
