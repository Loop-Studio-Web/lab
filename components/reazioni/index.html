<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<title data-i18n="rz.1">Reazioni — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../_shared/suite.css" />
		<script src="../_shared/suite.js" defer></script>
	</head>
	<body>
		<h1 class="sr-only" data-i18n="rz.2">Reazioni</h1>
		<div data-suite>
			<div class="suite__top">
				<div class="suite__scroll">
					<div class="suite__list" role="tablist" aria-label="Reazioni" data-i18n-attr="aria-label=rz.7">
						<button type="button" role="tab" id="t-like" data-id="like" data-src="../like/" data-title="Like" data-i18n="rz.3" data-i18n-attr="data-title=rz.3">Like</button>
						<button type="button" role="tab" id="t-stelle" data-id="stelle" data-src="../stelle-voto/" data-title="Stelle di voto" data-i18n="rz.4" data-i18n-attr="data-title=rz.4">Stelle di voto</button>
						<button type="button" role="tab" id="t-campanella" data-id="campanella" data-src="../campanella/" data-title="Campanella" data-i18n="rz.5" data-i18n-attr="data-title=rz.5">Campanella</button>
						<button type="button" role="tab" id="t-copia" data-id="copia" data-src="../copia-appunti/" data-title="Copia" data-i18n="rz.6" data-i18n-attr="data-title=rz.6">Copia</button>
						<span class="suite__bar" aria-hidden="true"></span>
					</div>
				</div>
			</div>
			<div class="suite__panels"></div>
		</div>
		<script src="../_shared/studio.js"></script>
	</body>
</html>
