<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<title data-i18n="fd.title">Blocchi di fiducia — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../_shared/suite.css" />
		<script src="../_shared/suite.js" defer></script>
	</head>
	<body>
		<h1 class="sr-only" data-i18n="fd.h1">Blocchi di fiducia</h1>
		<div data-suite>
			<div class="suite__top">
				<div class="suite__scroll">
					<div class="suite__list" role="tablist" aria-label="Modi di costruire fiducia in una pagina" data-i18n-attr="aria-label=fd.tabs">
						<button type="button" role="tab" id="t-contatori" data-id="contatori" data-src="contatori/" data-title="Contatori" data-i18n="contatori.name" data-i18n-attr="data-title=contatori.name">Contatori</button>
						<button type="button" role="tab" id="t-barre" data-id="barre" data-src="barre/" data-title="Barre" data-i18n="barre.name" data-i18n-attr="data-title=barre.name">Barre</button>
						<button type="button" role="tab" id="t-certificazioni" data-id="certificazioni" data-src="certificazioni/" data-title="Certificazioni" data-i18n="certificazioni.name" data-i18n-attr="data-title=certificazioni.name">Certificazioni</button>
						<button type="button" role="tab" id="t-testimonianze" data-id="testimonianze" data-src="testimonianze/" data-title="Testimonianze" data-i18n="testimonianze.name" data-i18n-attr="data-title=testimonianze.name">Testimonianze</button>
						<span class="suite__bar" aria-hidden="true"></span>
					</div>
				</div>
			</div>
			<div class="suite__panels"></div>
		</div>
		<script src="../_shared/studio.js"></script>
	</body>
</html>
