<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<title data-i18n="gf.title">Gesti e fisica — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="../_shared/suite.css" />
		<script src="../_shared/suite.js" defer></script>
	</head>
	<body>
		<h1 class="sr-only" data-i18n="gf.h1">Gesti e fisica</h1>
		<div data-suite>
			<div class="suite__top">
				<div class="suite__scroll">
					<div class="suite__list" role="tablist" aria-label="Gesti con il dito che seguono la fisica" data-i18n-attr="aria-label=gf.tabs">
						<button type="button" role="tab" id="t-carte" data-id="carte" data-src="carte/" data-title="Carte" data-i18n="carte.name" data-i18n-attr="data-title=carte.name">Carte</button>
						<button type="button" role="tab" id="t-pannello" data-id="pannello" data-src="pannello/" data-title="Pannello" data-i18n="pannello.name" data-i18n-attr="data-title=pannello.name">Pannello</button>
						<button type="button" role="tab" id="t-lancia" data-id="lancia" data-src="lancia/" data-title="Lancia" data-i18n="lancia.name" data-i18n-attr="data-title=lancia.name">Lancia</button>
						<button type="button" role="tab" id="t-aggiorna" data-id="aggiorna" data-src="aggiorna/" data-title="Aggiorna" data-i18n="aggiorna.name" data-i18n-attr="data-title=aggiorna.name">Aggiorna</button>
						<span class="suite__bar" aria-hidden="true"></span>
					</div>
				</div>
			</div>
			<div class="suite__panels"></div>
		</div>
		<script src="../_shared/studio.js"></script>
	</body>
</html>
