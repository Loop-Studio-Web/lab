<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="../_shared/i18n.js"></script>
		<script src="i18n.js"></script>
		<title data-i18n="vt.1">Popup video — Loop Studio Lab</title>
		<link rel="preload" href="../_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../_shared/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../_shared/base.css" />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<main class="demo">
			<section class="feature">
				<div class="feature__media">
					<img src="poster.webp" alt="Valle alpina vista dall’alto con una strada che sale tra i pascoli" width="1280" height="720"  data-i18n-attr="alt=vt.6"/>
				</div>
				<div class="feature__copy">
					<p class="feature__eyebrow" data-i18n="vt.2">Dietro le quinte</p>
					<h1 data-i18n="vt.3">Un video che si apre senza far uscire dalla pagina</h1>
					<p data-i18n="vt.4">
						Utile per un reel di portfolio, la testimonianza di un cliente o la presentazione di un
						prodotto. Il video si carica solo quando lo apri.
					</p>
					<button type="button" class="play" data-open>
						<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L8.5 4.64A1 1 0 0 0 7 5.5Z" /></svg>
						<span data-i18n="vt.5">Guarda il video</span>
					</button>
				</div>
			</section>
		</main>

		<dialog class="player" data-dialog aria-label="Video: dietro le quinte" data-i18n-attr="aria-label=vt.7">
			<button type="button" class="player__close" data-close aria-label="Chiudi il video" data-i18n-attr="aria-label=vt.8">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
			</button>
			<video controls playsinline preload="none" poster="poster.webp" data-video>
				<source src="alpi.mp4" type="video/mp4" />
			</video>
		</dialog>
		<script src="../_shared/studio.js"></script>
	</body>
</html>
