<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Galleria da trascinare — Loop Studio Lab</title>
		<link rel="icon" href="data:," />
		<link rel="preload" as="font" type="font/woff2" href="../components/_shared/fonts/bricolage-grotesque-latin-wght-normal.woff2" crossorigin />
		<link rel="stylesheet" href="../components/_shared/base.css" />

	</head>

	<body>
		<!-- Marchio ufficiale (rosso + bianco), usato nella cella finale. -->

		<main class="galleria">
			<div class="viewport" id="viewport">
				<!-- La griglia (intro + 16 foto + cella finale) la genera script.js dai dati. -->
				<ul class="canvas" id="canvas" role="list"></ul>
			</div>

			<p class="suggerimento" id="suggerimento">Trascina · tocca una foto</p>
			<button class="suono" id="suono" type="button" aria-pressed="false" aria-label="Suono" title="Suono">
				<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
					<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" />
					<g class="suono__onde" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
						<path d="M15.5 9.2a4 4 0 0 1 0 5.6" />
						<path d="M18.3 6.5a8 8 0 0 1 0 11" />
					</g>
					<path class="suono__croce" d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
				</svg>
			</button>
		</main>

		<!-- Dettaglio: dialog nativo (focus, Esc e inerzia dello sfondo li gestisce il browser). -->
		<dialog class="dettaglio" id="dettaglio" aria-labelledby="d-titolo" tabindex="-1" autofocus>
			<div class="d-griglia">
				<div class="d-foto" id="d-foto">
					<img id="d-img" alt="" decoding="async" />
				</div>
				<div class="d-testo">
					<div class="d-alto">
						<p class="d-num" id="d-num"></p>
						<button class="d-chiudi" id="d-chiudi" type="button">
							<span>Chiudi</span>
							<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
						</button>
					</div>
					<div class="d-corpo">
						<p class="d-luogo" id="d-luogo"></p>
						<h2 id="d-titolo"></h2>
						<p class="d-desc" id="d-desc"></p>
						<p class="d-credito" id="d-credito"></p>
					</div>
					<div class="d-nav">
						<button class="d-freccia" id="d-prec" type="button" aria-label="Foto precedente">
							<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
						</button>
						<button class="d-freccia" id="d-succ" type="button" aria-label="Foto successiva">
							<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
						</button>
					</div>
				</div>
			</div>
		</dialog>

		<script src="../components/_shared/gsap/gsap.min.js"></script>
		<script src="../components/_shared/gsap/Draggable.min.js"></script>
		<script src="../components/_shared/gsap/Flip.min.js"></script>
		<script src="../components/_shared/gsap/InertiaPlugin.min.js"></script>
		<script src="script.js"></script>
		<script src="../components/_shared/studio.js"></script>
	</body>
</html>
