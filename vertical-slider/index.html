<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
      integrity="sha512-+4zCK9k+qNFUR5X+cKL9EIR+ZOhtIloNl9GIKS57V1MyNsYpYcUrUeQc9vNfzsWfV28IaLL3i96P9sdNyeRssA=="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Vertical Slider</title>
    <script src="script.js" defer></script>
    <link
      rel="shortcut icon"
      href="slider-image-svgrepo-com.svg"
      type="image/x-icon"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="https://theloopstudio.org" target="_blank" rel="noopener noreferrer">
          <img src="img/loop_nero.png" alt="Loop Studio" />
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="https://theloopstudio.org" target="_blank" rel="noopener noreferrer">Home</a></li>
          <li><a href="https://theloopstudio.org/contatti" target="_blank" rel="noopener noreferrer">Contacts</a></li>
          <li><a href="https://theloopstudio.org/portfolio" target="_blank" rel="noopener noreferrer">Info</a></li>
        </ul>
      </nav>
    </header>
    <div class="slider-container">
      <div class="left-slide">
        <div>
          <p class="tag">New Collection</p>
          <h1>Pareos</h1>
        </div>
        <div>
          <p class="tag">New Collection</p>
          <h1>Swimsuits</h1>
        </div>
        <div>
          <p class="tag">New Collection</p>
          <h1>Crop Tops</h1>
        </div>
        <div>
          <p class="tag">New Collection</p>
          <h1>Accessories</h1>
        </div>
      </div>
      <div class="right-slide">
        <div
          style="
            background-image: url('https://images.unsplash.com/photo-1567640157569-f93dc2275420?ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
          "
        ></div>
        <div
          style="
            background-image: url('https://images.unsplash.com/photo-1552996923-5063f7db50ee?ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&ixlib=rb-1.2.1&auto=format&fit=crop&w=1050&q=80');
          "
        ></div>
        <div
          style="
            background-image: url('https://images.unsplash.com/photo-1559992490-51463933f67e?ixlib=rb-1.2.1&ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&auto=format&fit=crop&w=1350&q=80');
          "
        ></div>
        <div
          style="
            background-image: url('https://images.unsplash.com/photo-1561076722-85adfb3195cb?ixlib=rb-1.2.1&ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&auto=format&fit=crop&w=1350&q=80');
          "
        ></div>
      </div>
      <div class="action-buttons">
        <button class="down-button">
          <i class="fas fa-arrow-down"></i>
        </button>
        <button class="up-button">
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </body>
</html>
